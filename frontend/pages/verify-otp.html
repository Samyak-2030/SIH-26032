<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP | Kisanसेतु</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/farmer-login.css">
    <link rel="stylesheet" href="../css/verify-otp.css">
</head>

<body class="auth-page">
    <main class="auth-shell">
        <a class="auth-brand" href="../index.html#home" aria-label="Return to Kisanसेतु home">
            <span class="auth-brand-mark" aria-hidden="true">K</span>
            <span>Kisanसेतु</span>
        </a>

        <section class="login-card" aria-labelledby="otp-title">
            <div class="login-card-icon" aria-hidden="true">&#128273;</div>
            <p class="auth-eyebrow">Secure verification</p>
            <h1 id="otp-title">Verify OTP</h1>
            <p class="login-intro">Enter the 6-digit OTP sent to <strong id="mobile-display">your mobile
                    number</strong>.</p>

            <form id="otp-form" novalidate>
                <label class="field-label" for="otp-input">Enter OTP</label>
                <input id="otp-input" class="otp-input" type="text" inputmode="numeric" autocomplete="one-time-code"
                    maxlength="6" placeholder="000000" required>
                <p class="form-message" id="otp-message" role="status" aria-live="polite"></p>
                <button class="send-otp-button" type="submit">Submit OTP</button>
            </form>

            <button class="resend-button" id="resend-otp" type="button">Resend OTP</button>
            <p class="register-prompt"><a href="farmer-login.html">Change mobile number</a></p>
            <div class="support-line">
                <span aria-hidden="true">&#9742;</span>
                <span>Need help? <a href="mailto:support@kisansetu.in">Contact support</a></span>
            </div>
        </section>
    </main>

    <script src="../js/verify-otp.js"></script>
</body>

</html>
