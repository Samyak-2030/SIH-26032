<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register as Farmer - Kisanसेतु</title>

    <link rel="stylesheet" href="../css/farmer-register.css">
</head>

<body>

    <div class="register-container">

        <!-- Logo -->
        <div class="logo-container">
            <span class="brand-mark" aria-hidden="true">K</span>
        </div>

        <div class="register-header">
            <h1>Register as a Farmer</h1>
            <p>Join Kisanसेतु and simplify your crop procurement</p>
        </div>

        <form id="farmer-register-form">

            <!-- Personal Information -->
            <div class="form-section">
                <h2>Personal Information</h2>

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="mobile">Mobile Number</label>
                        <input
                            type="tel"
                            id="mobile"
                            name="mobile"
                            placeholder="10-digit mobile number"
                            maxlength="10"
                            inputmode="numeric"
                            pattern="[0-9]{10}"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                        >
                    </div>

                </div>
            </div>


            <!-- Farm Details -->
            <div class="form-section">
                <h2>Farm Details</h2>

                <div class="form-row">

                    <!-- State Dropdown -->
                    <div class="form-group">
                        <label for="state">State</label>

                        <select id="state" name="state" required>
                            <option value="">Select your state</option>

                            <option value="andhra-pradesh">Andhra Pradesh</option>
                            <option value="arunachal-pradesh">Arunachal Pradesh</option>
                            <option value="assam">Assam</option>
                            <option value="bihar">Bihar</option>
                            <option value="chhattisgarh">Chhattisgarh</option>
                            <option value="goa">Goa</option>
                            <option value="gujarat">Gujarat</option>
                            <option value="haryana">Haryana</option>
                            <option value="himachal-pradesh">Himachal Pradesh</option>
                            <option value="jharkhand">Jharkhand</option>
                            <option value="karnataka">Karnataka</option>
                            <option value="kerala">Kerala</option>
                            <option value="madhya-pradesh">Madhya Pradesh</option>
                            <option value="maharashtra">Maharashtra</option>
                            <option value="manipur">Manipur</option>
                            <option value="meghalaya">Meghalaya</option>
                            <option value="mizoram">Mizoram</option>
                            <option value="nagaland">Nagaland</option>
                            <option value="odisha">Odisha</option>
                            <option value="punjab">Punjab</option>
                            <option value="rajasthan">Rajasthan</option>
                            <option value="sikkim">Sikkim</option>
                            <option value="tamil-nadu">Tamil Nadu</option>
                            <option value="telangana">Telangana</option>
                            <option value="tripura">Tripura</option>
                            <option value="uttar-pradesh">Uttar Pradesh</option>
                            <option value="uttarakhand">Uttarakhand</option>
                            <option value="west-bengal">West Bengal</option>

                            <option value="andaman-nicobar">
                                Andaman and Nicobar Islands
                            </option>
                            <option value="chandigarh">Chandigarh</option>
                            <option value="dadra-nagar-haveli-daman-diu">
                                Dadra and Nagar Haveli and Daman and Diu
                            </option>
                            <option value="delhi">Delhi</option>
                            <option value="jammu-kashmir">
                                Jammu and Kashmir
                            </option>
                            <option value="ladakh">Ladakh</option>
                            <option value="lakshadweep">Lakshadweep</option>
                            <option value="puducherry">Puducherry</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="district">District</label>
                        <input
                            type="text"
                            id="district"
                            name="district"
                            placeholder="Enter your district"
                            required
                        >
                    </div>

                </div>

                <div class="form-group">
                    <label for="village">Village</label>
                    <input
                        type="text"
                        id="village"
                        name="village"
                        placeholder="Enter your village"
                        required
                    >
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="landArea">Land Area (in acres)</label>
                        <input
                            type="number"
                            id="landArea"
                            name="landArea"
                            placeholder="e.g. 5"
                            min="0.1"
                            step="0.1"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="crop">Primary Crop</label>

                        <select id="crop" name="crop" required>
                            <option value="">Select crop</option>
                            <option value="wheat">Wheat</option>
                            <option value="rice">Rice</option>
                            <option value="maize">Maize</option>
                            <option value="mustard">Mustard</option>
                            <option value="cotton">Cotton</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                </div>
            </div>


            <!-- Account Security -->
            <div class="form-section">
                <h2>Account Security</h2>

                <div class="form-row">

                    <div class="form-group">
                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >
                    </div>

                </div>
            </div>


            <div id="form-message"></div>

            <button type="submit" class="register-button">
                Register as Farmer
            </button>

        </form>

    </div>

    <script src="../js/farmer-register.js"></script>

</body>
</html>
