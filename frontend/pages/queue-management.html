<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Queue Management | Kisanसेतु</title><link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/admin.css"></head><body class="admin-page"><div class="admin-layout"><aside class="admin-sidebar"><a class="admin-brand" href="admin-dashboard.html"><span class="admin-brand-mark">K</span>Kisanसेतु</a><nav class="admin-nav"><a href="admin-dashboard.html"><span>◫</span>Overview</a><a href="centre-management.html"><span>▦</span>Centre Management</a><a href="live-centre-monitoring.html"><span>◉</span>Live Monitoring</a><a class="active" href="queue-management.html"><span>◷</span>Queue Management</a><a href="reports-analytics.html"><span>▤</span>Reports &amp; Analytics</a><a href="alerts-notifications.html"><span>!</span>Alerts</a></nav></aside><main class="admin-main"><header class="admin-heading"><div><p class="admin-kicker">A5. Queue management</p><h1>Queue Management - Centre A</h1><p>Manage and call next tokens</p></div></header><section class="admin-panel admin-full-panel"><div class="admin-form-row"><div class="admin-stat"><span>Currently serving</span><strong>Token #103</strong></div><div class="admin-stat"><span>Waiting</span><strong>68</strong></div><div class="admin-stat"><span>Next token</span><strong>#104</strong></div></div><div class="admin-inline-actions"><button class="admin-primary-button admin-action" id="call-next" type="button">Call Next Token (#104)</button><button class="admin-action admin-danger" id="pause-queue" type="button">Pause Queue</button></div><h2 style="margin-top:34px">Recent Tokens</h2><div class="admin-inline-actions"><span class="admin-action">#100</span><span class="admin-action">#101</span><span class="admin-action">#102</span><span class="admin-action">#103</span></div><p id="queue-message" class="admin-panel-subtitle"></p></section></main></div><script>const callNext=document.querySelector('#call-next');const pauseQueue=document.querySelector('#pause-queue');const message=document.querySelector('#queue-message');callNext.addEventListener('click',()=>message.textContent='Token #104 has been called.');pauseQueue.addEventListener('click',()=>{pauseQueue.textContent=pauseQueue.textContent.includes('Resume')?'Pause Queue':'Resume Queue';message.textContent=pauseQueue.textContent.includes('Resume')?'Queue paused.':'Queue resumed.';});</script></body></html>
